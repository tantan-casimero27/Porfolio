<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <radialGradient id="cosmos" cx="0" cy="0" r="1" gradientTransform="matrix(650 210 -230 710 1280 365)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#087c9b" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#123355" stop-opacity=".15"/>
      <stop offset="1" stop-color="#080b12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="collision" cx="0" cy="0" r="1" gradientTransform="matrix(210 0 0 220 1005 438)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd166" stop-opacity=".42"/>
