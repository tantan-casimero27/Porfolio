      <stop offset=".46" stop-color="#ffd166" stop-opacity=".48"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".76"/>
    </linearGradient>
    <linearGradient id="trace" x1="749" x2="1418" y1="456" y2="458" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff6b2c" stop-opacity="0"/>
      <stop offset=".4" stop-color="#ffb347" stop-opacity=".76"/>
      <stop offset=".75" stop-color="#22d3ee" stop-opacity=".82"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-glow" width="1.6" height="1.6" x="-.3" y="-.3" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="19"/>
    </filter>
    <style>
      /* Animate the existing linework without changing the backdrop composition. */
      .warm-lines {
        transform-box: view-box;
        transform-origin: 800px 450px;
        animation: warm-orbit 58s linear infinite;
      }
      .cool-lines {
        transform-box: view-box;
        transform-origin: 800px 450px;
        animation: cool-orbit 46s linear infinite;
      }
      .draw-lines path {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: line-draw 11s ease-in-out infinite alternate;
      }
      .draw-lines path:nth-child(2n) { animation-delay: -4s; }
      .draw-lines path:nth-child(3n) { animation-delay: -7s; }
      .trace-lines path {
        stroke-dasharray: .14 .86;
        stroke-dashoffset: 0;
        animation: highlight-travel 9s linear infinite;
      }
      .trace-lines path:nth-child(2) { animation-duration: 12s; animation-delay: -5s; }
      @keyframes warm-orbit { to { transform: rotate(360deg); } }
      @keyframes cool-orbit { to { transform: rotate(-360deg); } }
      @keyframes line-draw { to { stroke-dashoffset: 0; } }
      @keyframes highlight-travel { to { stroke-dashoffset: -1; } }
      @media (prefers-reduced-motion: reduce) {
        .warm-lines, .cool-lines, .draw-lines path, .trace-lines path {
          animation: none;
          stroke-dasharray: none;
          stroke-dashoffset: 0;
        }
      }
    </style>
  </defs>
